<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--text:#1d232b;--muted:#525c6a;--line:#e3e6ea;--accent:#2563eb;--onacc:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--field:#e8f0fe;--item:#eef2f8;--itemline:#c9d4e4;--okbg:#e3f5e8;--okline:#9fd4ad;--oktx:#14532d;--wbg:#fdf0d5;--wline:#f0c36b;--wtx:#7a4a00;--bbg:#fde4e4;--bline:#f0a3a3;--btx:#8f1d1d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151a;--card:#1b2027;--text:#e8ebef;--muted:#aab3bf;--line:#2a313a;--accent:#60a5fa;--onacc:#0b1220;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--field:#2a3547;--item:#262f3c;--itemline:#394659;--okbg:#1f3a2a;--okline:#2f6a47;--oktx:#86efac;--wbg:#3d3015;--wline:#7a5c1c;--wtx:#fcd34d;--bbg:#40201f;--bline:#7a3535;--btx:#fca5a5}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12151a;--card:#1b2027;--text:#e8ebef;--muted:#aab3bf;--line:#2a313a;--accent:#60a5fa;--onacc:#0b1220;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--field:#2a3547;--item:#262f3c;--itemline:#394659;--okbg:#1f3a2a;--okline:#2f6a47;--oktx:#86efac;--wbg:#3d3015;--wline:#7a5c1c;--wtx:#fcd34d;--bbg:#40201f;--bline:#7a3535;--btx:#fca5a5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;font-family:inherit;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,.li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h2{font-size:1.3rem;margin:0}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.sum,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:1rem;margin-bottom:4px}
.sum .row{display:flex;justify-content:space-between;gap:8px;text-align:center}
.sum small,.card small,.li small{display:block;color:var(--muted);font-size:.86rem}
.sum b{font-size:1.15rem}
.neg{color:var(--bad)}
.n{text-align:center;margin-top:8px}
.bar{display:flex;height:8px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,rgba(105,115,130,.95),rgba(172,180,192,.95));transition:width .3s}
.bar i.w{background:linear-gradient(90deg,rgba(150,158,170,.6),rgba(192,199,209,.6))}
.bar.big{height:12px}
.hint{color:var(--muted);font-size:.95rem;margin:0 0 12px}
.hint.bad{color:var(--bad)}
.it{margin-top:12px}
.it .top{display:flex;justify-content:space-between;gap:8px}
.it .top{align-items:center}
.it .sub{margin-top:8px;margin-bottom:0}
.it .sub span{color:var(--muted);font-size:.76rem;font-weight:400}
.chip{flex:none;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.chip.ok{background:var(--okbg);color:var(--oktx);border-color:var(--okline)}
.chip.warn{background:var(--wbg);color:var(--wtx);border-color:var(--wline)}
.chip.bad{background:var(--bbg);color:var(--btx);border-color:var(--bline)}
.chip.mute{background:var(--item);color:var(--muted);border-color:var(--itemline)}
.li{display:flex;align-items:center;gap:10px;width:100%;background:var(--item);border:1px solid var(--itemline);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer}
.li .m{flex:1;min-width:0}
.li .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .m small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .a{font-weight:600;white-space:nowrap}
.chk{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--itemline);background:var(--card);color:var(--onacc);font-size:1rem;line-height:1;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:15px 1px;min-width:0;font-size:clamp(.66rem,2.9vw,.8rem)}
.tabs button.on{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
.pri{background:var(--accent)!important;color:var(--onacc)!important;border-color:var(--accent)!important}
.hd .pri,.card .pri{border:0;border-radius:10px;padding:10px 14px;font-size:.95rem}
.btn{width:100%;margin-top:8px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1rem}
.top{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.apphead{display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,16px);max-width:560px;margin:0 auto;padding:12px 16px 0}
.apphead h1{margin:0;font-size:clamp(1.3rem,6.4vw,2.1rem);white-space:nowrap;font-weight:800;line-height:1.15;background:linear-gradient(90deg,#ff9a1f,#ff6a3d 50%,#ff3d78);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 8px rgba(255,90,110,.4)) drop-shadow(0 2px 0 rgba(110,20,40,.35))}
.coin{flex:none;width:clamp(28px,8vw,44px);height:clamp(28px,8vw,44px);filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.coin.l{transform:rotate(-14deg)}.coin.r{transform:rotate(14deg)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.seg button{min-height:44px;border-radius:10px;border:2px solid transparent;background:var(--item);color:var(--text);font-size:.9rem;font-weight:600}
.seg button.on{border-color:var(--accent);background:var(--field)}
.seg button.on.auf{border-color:var(--warn)}.seg button.on.ab{border-color:var(--ok)}
.top b[data-a]{cursor:pointer}
.kpi{flex:1;background:none;border:0;color:inherit;font:inherit;padding:6px 4px;border-radius:10px;text-align:center}
.kpi:active{background:var(--item)}
.kpi b{border-bottom:1px dashed var(--muted)}
.lnk{display:block;margin:6px auto 0;background:none;border:0;color:var(--accent);font-size:.9rem;text-decoration:underline}
.cr{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.cr small{display:block;color:var(--muted);font-size:.84rem}
.cr b{white-space:nowrap;font-weight:600}
.cr.tot{border-bottom:0;border-top:2px solid var(--text);margin-top:4px}
.cr.tot b{font-weight:800}
dialog{max-height:85vh}
dialog h4{margin:14px 0 2px;font-size:.9rem;color:var(--muted)}
.li.done{background:var(--okbg);border-color:var(--okline)}
.it.done{background:var(--okbg);border:1px solid var(--okline);border-radius:12px;padding:8px 10px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--text);font-size:1rem;margin-top:16px}
.sw input{position:absolute;opacity:0;width:1px;height:1px;padding:0;margin:0;border:0}
.sw i{flex:none;position:relative;width:54px;height:32px;border-radius:99px;background:var(--itemline);transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .2s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(22px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
html{-webkit-text-size-adjust:100%}
.hd h2{font-size:1.65rem;font-weight:800;line-height:1.15}
.card h2{font-size:1.25rem;font-weight:800;line-height:1.2;margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.card>.top b{font-size:1.1rem;font-weight:700}
.it{margin-top:16px}
.it .top b{font-size:1rem;font-weight:600}
.it .sub{flex-wrap:wrap}
.li .m b{font-size:1rem;font-weight:600}
.li .a{font-size:1rem;font-weight:700}
.sum b{font-size:1.25rem;font-weight:800}
dialog h3{font-size:1.3rem;margin-bottom:8px}
.it .sub b{font-size:inherit;font-weight:500}
.fold{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left}
.fold .fs{display:none;margin-left:auto;font-size:.85rem;font-weight:400;color:var(--muted)}
.chev{flex:none;width:10px;height:10px;margin:-4px 4px 0 auto;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.card.closed .fs{display:inline}
.card.closed .chev{margin-left:0;margin-top:0;transform:rotate(-45deg)}
.card.closed h2{border-bottom:0;margin-bottom:0;padding-bottom:0}
.card.closed>:not(h2){display:none}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);padding:16px;width:min(92vw,440px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 4px}
label{display:block;font-size:.85rem;color:var(--muted);margin-top:10px}
input,select{display:block;width:100%;margin-top:4px;padding:12px;font:16px system-ui,sans-serif;background:var(--field);border:1px solid var(--line);border-radius:10px;color:var(--text)}
input.err{border-color:var(--bad)}
.btns{display:flex;gap:8px;margin-top:16px}
.btns button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1rem}
.btns .del{color:var(--bad)}
</style>
</head>
<body>
<header class="apphead"><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a0"/><stop offset=".5" stop-color="#f2b73a"/><stop offset="1" stop-color="#b9791a"/></linearGradient><symbol id="coin" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="url(#cg)" stroke="#8a5a10" stroke-width="2"/><circle cx="24" cy="24" r="16.5" fill="none" stroke="#fff3c2" stroke-opacity=".75" stroke-width="2"/><text x="24" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="22" fill="#7a4a08">€</text></symbol></defs></svg><svg class="coin l" aria-hidden="true"><use href="#coin"/></svg><h1>Mein Haus Budget</h1><svg class="coin r" aria-hidden="true"><use href="#coin"/></svg></header>
<main id="app"></main>
<nav class="tabs">
<button data-a="tab" data-v="ue">Übersicht</button>
<button data-a="tab" data-v="to">Töpfe</button>
<button data-a="tab" data-v="ge">Gewerke</button>
<button data-a="tab" data-v="be">Bemusterung</button>
<button data-a="tab" data-v="re">Rechnungen</button>
</nav>
<dialog id="dlg"><form id="f" autocomplete="off"></form></dialog>
<input type="file" id="imp" accept="application/json,.json" hidden>
<script>
var K="baubudget-v1",A=document.getElementById("app"),D=document.getElementById("dlg"),F=document.getElementById("f"),tab="ue",S=load();
function def(){return{toepfe:[{id:"t1",name:"Bankdarlehen",rahmen:0},{id:"t2",name:"KfW-Darlehen",rahmen:0},{id:"t3",name:"Eigenkapital",rahmen:0}],
gewerke:["Fertighaus SchreyoeggBau (Festpreis)","Grundstück","Nebenkosten (Notar, Steuer)","Planung und Statik","Erdarbeiten","Rohbau","Dach","Fenster und Türen","Elektro","Fliesen","Küche (extern)","Bodenbeläge (Eigenleistung)","Sanitär und Heizung","Innenausbau","Außenanlagen","Unvorhergesehenes"].map(function(n,i){return{id:"g"+i,name:n,budget:0}}),rechnungen:[],optionen:[],abzuege:[],setup:{done:true,step:0},bem:defBem()}}
function load(){try{var j=localStorage.getItem(K);if(j)return mig(JSON.parse(j))}catch(x){}return def()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function today(){return new Date().toLocaleDateString("sv-SE")}
function dt(d){return d.split("-").reverse().join(".")}
function e(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function eur(n,d){return new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",minimumFractionDigits:d||0,maximumFractionDigits:d||0}).format(n)}
function num(s){s=String(s).trim().replace(/\s|€/g,"");if(!s)return NaN;if(s.indexOf(",")>-1)s=s.replace(/\./g,"").replace(",",".");else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");return Number(s)}
function fm(n){return String(n).replace(".",",")}
function nm(l,id){for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i].name;return""}
function get(l,id){return l.filter(function(x){return x.id===id})[0]}
function stats(){var st={rahmen:0,budget:0,bez:0,off:0,t:{},g:{}};
S.toepfe.forEach(function(t){st.rahmen+=t.rahmen;st.t[t.id]={bez:0,off:0}});
S.gewerke.forEach(function(g){st.budget+=g.budget;st.g[g.id]={bez:0,off:0}});
S.rechnungen.forEach(function(r){var k=r.status==="bezahlt"?"bez":"off";st[k]+=r.betrag;if(st.t[r.topf])st.t[r.topf][k]+=r.betrag;if(st.g[r.gewerk])st.g[r.gewerk][k]+=r.betrag});
st.prog=0;S.gewerke.forEach(function(g){st.prog+=plan(g)});S.abzuege.forEach(function(a){st.prog-=a.betrag});
st.auf=0;st.ab=0;st.offen=0;S.bem.forEach(function(b){if(b.status==="auf")st.auf+=b.betrag;else if(b.status==="ab")st.ab+=b.betrag;else if(b.status==="offen")st.offen++});st.prog+=st.auf-st.ab;
return st}
function bar(b,o,max){var p1=0,p2=0,u=b+o;if(max>0){p1=Math.min(100,b/max*100);p2=Math.min(100-p1,o/max*100)}else if(u>0)p1=100;
return'<div class="bar'+(u>max&&u>0?" over":"")+'"><i style="width:'+p1+'%"></i><i class="w" style="width:'+p2+'%"></i></div>'}
function gbar(b,o,max){var u=b+o,f=max>0?u/max:(u>0?1:0),c="hsl("+Math.round(120*(1-Math.min(1,f)))+",70%,42%)",p1=max>0?Math.min(100,b/max*100):(u>0?100:0),p2=max>0?Math.min(100-p1,o/max*100):0;return'<div class="bar big"><i style="width:'+p1+"%;background:"+c+'"></i><i style="width:'+p2+"%;background:"+c+';opacity:.5"></i></div>'}
function fcard(k,t,sm){var c=S.ui&&S.ui[k];return'<div class="card'+(c?" closed":"")+'"><h2><button type="button" class="fold" data-a="fold" data-v="'+k+'" aria-expanded="'+(c?"false":"true")+'">'+t+'<span class="fs">'+sm+'</span><span class="chev" aria-hidden="true"></span></button></h2>'}
function chip(k,t){return'<span class="chip '+k+'">'+t+"</span>"}
function stat(u,b,ab){if(ab)return u>b?chip("bad","Über Budget"):chip("ok","✓ Abgerechnet");if(b<=0)return u>0?chip("bad","Überschritten"):"";if(u>b)return chip("bad","Überschritten");if(u>=b*.9)return chip("warn","Knapp");return u>0?chip("ok","Im Budget"):chip("mute","Ungenutzt")}
function item(n,r,x,b,ch,d){return'<div class="it'+(d?" done":"")+'"><div class="top"><b>'+e(n)+"</b>"+ch+"</div>"+b+'<div class="top sub"><span>'+r+"</span><span>"+x+"</span></div></div>"}
function vUe(st){var used=st.bez+st.off,frei=st.rahmen-used,h='<div class="hd"><h2>Übersicht</h2></div><div class="sum"><div class="row"><button class="kpi" data-a="calc" data-v="rahmen"><small>Rahmen</small><b>'+eur(st.rahmen)+'</b></button><button class="kpi" data-a="calc" data-v="aus"><small>Ausgegeben</small><b>'+eur(used)+'</b></button><button class="kpi" data-a="calc" data-v="frei"><small>Frei</small><b class="'+(frei<0?"neg":"")+'">'+eur(frei)+"</b></button></div>"+gbar(st.bez,st.off,st.rahmen)+'<small class="n">Bezahlt '+eur(st.bez)+" · Offen "+eur(st.off)+"</small></div>";
if(!st.rahmen)h+='<p class="hint">Trage unter „Töpfe“ den Rahmen von Bank und KfW ein.</p>';
else h+='<div class="sum"><div class="row"><button class="kpi" data-a="calc" data-v="prog"><small>Prognose</small><b>'+eur(st.prog)+'</b></button><button class="kpi" data-a="calc" data-v="spiel"><small>Spielraum</small><b class="'+(st.prog>st.rahmen?"neg":"")+'">'+eur(st.rahmen-st.prog)+'</b></button></div><small class="n">Prognose = geplante Gesamtkosten. Tippe auf einen Betrag für den Rechenweg.</small></div>';
h+=bemLine(st);h+=fcard("ft","Töpfe","Frei "+eur(frei));
S.toepfe.forEach(function(t){var x=st.t[t.id],u=x.bez+x.off;h+=item(t.name,eur(u)+" von "+eur(t.rahmen),(u>t.rahmen?'<b class="neg">Über Rahmen um '+eur(u-t.rahmen)+"</b>":"Frei "+eur(t.rahmen-u)),bar(x.bez,x.off,t.rahmen),stat(u,t.rahmen,false))});
h+="</div>"+fcard("fg","Gewerke",S.gewerke.length+" Gewerke");var c=0;
S.gewerke.forEach(function(g){var x=st.g[g.id],u=x.bez+x.off;if(!g.budget&&!u)return;c++;h+=item(g.name,eur(u)+" von "+eur(g.budget),(u>g.budget?'<b class="neg">Über Budget um '+eur(u-g.budget)+"</b>":"Frei "+eur(g.budget-u)),bar(x.bez,x.off,g.budget),stat(u,g.budget,g.abger),!!g.abger)});
if(!c)h+='<p class="hint">Lege unter „Gewerke“ Budgets fest oder erfasse Rechnungen.</p>';
return h+'</div><p class="hint">Knapp = ab 90 % des Budgets ausgegeben. Grün hinterlegt = Gewerk abgerechnet.</p>'}
function vRe(){var l=S.rechnungen.slice().sort(function(a,b){return b.datum.localeCompare(a.datum)}),h='<div class="hd"><h2>Rechnungen</h2><button class="pri" data-a="add-r">+ Rechnung</button></div>';
if(!l.length)h+='<p class="hint">Noch keine Rechnungen. Tippe auf „+ Rechnung“, um die erste zu erfassen.</p>';
l.forEach(function(r){var t=nm(S.toepfe,r.topf),ok=r.status==="bezahlt";
h+='<div class="li" tabindex="0" role="button" data-a="edit-r" data-id="'+r.id+'"><button class="chk'+(ok?" on":"")+'" data-a="tog" data-id="'+r.id+'" aria-label="'+(ok?"Als offen markieren":"Als bezahlt markieren")+'">'+(ok?"✓":"")+'</button><div class="m"><b>'+e(nm(S.gewerke,r.gewerk)||"Ohne Gewerk")+"</b><small>"+dt(r.datum)+(t?" · "+e(t):"")+(r.notiz?" · "+e(r.notiz):"")+'</small></div><span class="a">'+eur(r.betrag,2)+"</span></div>"});
return h}
function vGe(st){var h='<div class="hd"><h2>Gewerke</h2><button class="pri" data-a="add-g">+ Gewerk</button></div><p class="hint">Verteilt: '+eur(st.budget)+" von "+eur(st.rahmen)+" Rahmen</p>";
S.gewerke.forEach(function(g){var x=st.g[g.id];h+='<div class="li'+(g.abger?" done":"")+'" tabindex="0" role="button" data-a="edit-g" data-id="'+g.id+'"><div class="m"><b>'+e(g.name)+"</b><small>Ausgegeben "+eur(x.bez+x.off)+(g.abger?" · abgerechnet":"")+'</small></div><span class="a">'+eur(g.budget)+"</span></div>"});
